name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile sources
        run: python -m compileall -q services/api/app services/render-worker/worker
      - name: Unit tests
        working-directory: services/api
        run: |
          pip install \
            pytest \
            fastapi==0.68.1 \
            SQLAlchemy==1.4.23 \
            psycopg2-binary==2.9.9 \
            pydantic==1.10.15 \
            PyJWT==1.7.1 \
            celery==5.5.3 \
            redis==3.5.3 \
            PyYAML==6.0.2 \
            lxml==4.9.4 \
            python-multipart==0.0.5 \
            boto3==1.18.40 \
            requests==2.25.1 \
            httpx==0.24.1
          pytest -q

  share-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: node --check services/share-service/src/server.js

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML
        run: |
          python -m pip install pyyaml
          python scripts/validate_manifests.py
