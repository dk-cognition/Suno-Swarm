name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile sources
        run: python -m compileall -q services/api/app services/render-worker/worker
      - name: Unit tests
        working-directory: services/api
        run: |
          pip install pytest
          pytest -q

  share-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: node --check services/share-service/src/server.js

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML
        run: |
          python -m pip install pyyaml
          python scripts/validate_manifests.py

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format
        run: terraform fmt -check -recursive
      - name: Init
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
      - name: Policy tests
        run: terraform test
