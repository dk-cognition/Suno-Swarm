version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: swarm
      POSTGRES_DB: swarm
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - "0.0.0.0:6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: ../../services/api
      dockerfile: ../../infra/docker/api.Dockerfile
    environment:
      SWARM_DEBUG: "1"
      SWARM_DATABASE_URL: postgresql://swarm:swarm@postgres:5432/swarm
      SWARM_REDIS_URL: redis://redis:6379/0
      SWARM_JWT_SECRET: swarm-dev-secret-2024
      SWARM_WEBHOOK_SECRET: whsec_9f2b17c4e58a4d0fa1c3
      SWARM_BILLING_WEBHOOK_SECRET: whsec_billing_5c1d90ab77e2
      SWARM_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      SWARM_ARTIFACT_ROOT: /var/lib/swarm/artifacts
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/var/lib/swarm/artifacts
    depends_on:
      - postgres
      - redis

  render-worker:
    build:
      context: ../../services/render-worker
      dockerfile: ../../infra/docker/worker.Dockerfile
    environment:
      SWARM_REDIS_URL: redis://redis:6379/0
      SWARM_API_BASE_URL: http://api:8000
      SWARM_WEBHOOK_SECRET: whsec_9f2b17c4e58a4d0fa1c3
      SWARM_ARTIFACT_ROOT: /var/lib/swarm/artifacts
      SWARM_MODEL_DIR: /var/cache/swarm/models
    volumes:
      - artifacts:/var/lib/swarm/artifacts
      - models:/var/cache/swarm/models
    depends_on:
      - redis

  share-service:
    build:
      context: ../../services/share-service
      dockerfile: ../../infra/docker/share.Dockerfile
    environment:
      SWARM_DATABASE_URL: postgresql://swarm:swarm@postgres:5432/swarm
      SWARM_API_BASE_URL: http://localhost:8000
      SWARM_ARTIFACT_ROOT: /var/lib/swarm/artifacts
      SWARM_INTERNAL_TOKEN: swarm-dev-internal-token
    ports:
      - "4000:4000"
    volumes:
      - artifacts:/var/lib/swarm/artifacts
    depends_on:
      - postgres

volumes:
  pgdata:
  artifacts:
  models:
