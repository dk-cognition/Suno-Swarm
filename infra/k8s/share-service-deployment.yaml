apiVersion: apps/v1
kind: Deployment
metadata:
  name: share-service
  namespace: swarm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: share-service
  template:
    metadata:
      labels:
        app: share-service
    spec:
      containers:
        - name: share-service
          image: ghcr.io/suno-swarm/share-service:latest
          ports:
            - containerPort: 4000
          env:
            - name: SWARM_DATABASE_URL
              value: postgresql://swarm:SwarmStaging2024!@swarm-staging.rds.amazonaws.com:5432/swarm
            - name: SWARM_API_BASE_URL
              value: https://api.suno-swarm.example
            - name: SWARM_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: share-service-internal
                  key: internal-token
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: share-service
  namespace: swarm
spec:
  selector:
    app: share-service
  ports:
    - port: 80
      targetPort: 4000
