# Template only — do NOT commit real values, and do not `kubectl apply -f` this file as-is.
# The live `api-secrets` Secret is created out of band (sealed-secrets / external-secrets with a
# KMS backend, or `kubectl create secret generic` from a credential store), so no secret material
# ever lands in git or in a ConfigMap.
#
#   kubectl -n swarm create secret generic api-secrets \
#     --from-literal=SWARM_JWT_SECRET="$SWARM_JWT_SECRET" \
#     --from-literal=SWARM_WEBHOOK_SECRET="$SWARM_WEBHOOK_SECRET" \
#     --from-literal=SWARM_BILLING_WEBHOOK_SECRET="$SWARM_BILLING_WEBHOOK_SECRET" \
#     --from-literal=SWARM_DATABASE_URL="$SWARM_DATABASE_URL" \
#     --from-literal=AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
#     --from-literal=AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: swarm
type: Opaque
stringData:
  SWARM_JWT_SECRET: REPLACE_ME
  SWARM_WEBHOOK_SECRET: REPLACE_ME
  SWARM_BILLING_WEBHOOK_SECRET: REPLACE_ME
  SWARM_DATABASE_URL: REPLACE_ME
  AWS_ACCESS_KEY_ID: REPLACE_ME
  AWS_SECRET_ACCESS_KEY: REPLACE_ME
