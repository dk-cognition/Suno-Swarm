## Template for the cluster secrets consumed by the api, render-worker and
## share-service deployments. Do NOT commit a filled-in copy of this file:
## create the Secret out-of-band (sealed-secrets / external-secrets / `kubectl
## create secret`) so credentials never live in the repository.
##
##   kubectl -n swarm create secret generic swarm-secrets \
##     --from-literal=SWARM_DATABASE_URL="postgresql://USER:PASSWORD@HOST:5432/swarm"
apiVersion: v1
kind: Secret
metadata:
  name: swarm-secrets
  namespace: swarm
type: Opaque
stringData:
  SWARM_DATABASE_URL: postgresql://USER:PASSWORD@HOST:5432/swarm
