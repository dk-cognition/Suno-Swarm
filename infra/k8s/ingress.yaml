apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swarm
  namespace: swarm
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  rules:
    - host: api.suno-swarm.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
    - host: share.suno-swarm.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: share-service
                port:
                  number: 80
