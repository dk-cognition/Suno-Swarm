apiVersion: v1
kind: Namespace
metadata:
  name: swarm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: swarm
data:
  SWARM_DEBUG: "1"
  SWARM_S3_BUCKET: suno-swarm-artifacts
  SWARM_SHARE_BASE_URL: https://share.suno-swarm.example
  SWARM_JWT_SECRET: swarm-dev-secret-2024
  SWARM_WEBHOOK_SECRET: whsec_9f2b17c4e58a4d0fa1c3
  SWARM_BILLING_WEBHOOK_SECRET: whsec_billing_5c1d90ab77e2
  AWS_ACCESS_KEY_ID: AKIA3XJ7QK2LMNOPQR4S
  AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: swarm
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/suno-swarm/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: SWARM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: swarm-db
                  key: SWARM_DATABASE_URL
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/swarm/artifacts
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: swarm
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
