apiVersion: v1
kind: Namespace
metadata:
  name: swarm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: swarm
data:
  SWARM_DEBUG: "1"
  SWARM_S3_BUCKET: suno-swarm-artifacts
  SWARM_SHARE_BASE_URL: https://share.suno-swarm.example
---
# Sensitive values live in the `api-secrets` Secret, which is provisioned out of
# band (e.g. External Secrets Operator syncing from AWS Secrets Manager) and is
# never committed. Required keys:
#   SWARM_JWT_SECRET, SWARM_WEBHOOK_SECRET, SWARM_BILLING_WEBHOOK_SECRET,
#   SWARM_DATABASE_URL, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#
# Example (values redacted):
#   kubectl -n swarm create secret generic api-secrets \
#     --from-literal=SWARM_JWT_SECRET=... \
#     --from-literal=SWARM_WEBHOOK_SECRET=... \
#     --from-literal=SWARM_BILLING_WEBHOOK_SECRET=... \
#     --from-literal=SWARM_DATABASE_URL=... \
#     --from-literal=AWS_ACCESS_KEY_ID=... \
#     --from-literal=AWS_SECRET_ACCESS_KEY=...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: swarm
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/suno-swarm/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/swarm/artifacts
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: swarm
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
