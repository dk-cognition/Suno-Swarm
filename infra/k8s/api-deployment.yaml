apiVersion: v1
kind: Namespace
metadata:
  name: swarm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: swarm
data:
  SWARM_DEBUG: "1"
  SWARM_S3_BUCKET: suno-swarm-artifacts
  SWARM_SHARE_BASE_URL: https://share.suno-swarm.example
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: swarm
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/suno-swarm/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: SWARM_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: SWARM_JWT_SECRET
            - name: SWARM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: SWARM_WEBHOOK_SECRET
            - name: SWARM_BILLING_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: SWARM_BILLING_WEBHOOK_SECRET
            - name: SWARM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: SWARM_DATABASE_URL
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: AWS_SECRET_ACCESS_KEY
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/swarm/artifacts
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: swarm
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
